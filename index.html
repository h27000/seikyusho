<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>請求書</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="請求書">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background: #f0f2f5;
    color: #333;
  }

  /* ===== 編集パネル ===== */
  #editor {
    width: 650px;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    background: #fff;
    border-right: none;
    overflow-y: auto;
    padding: 20px;
    z-index: 10;
  }

  #resizer {
    position: fixed;
    top: 0; bottom: 0;
    left: 650px;
    width: 6px;
    cursor: col-resize;
    background: #e0e4ea;
    z-index: 20;
    transition: background 0.15s;
  }
  #resizer:hover, #resizer.dragging { background: #4f8ef7; }

  .mode-toggle {
    display: flex;
    background: #f0f2f5;
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
    gap: 3px;
  }
  .mode-btn {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    background: transparent;
    color: #888;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: #fff;
    color: #333;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }

  #editor h2 {
    font-size: 15px;
    color: #555;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid #4f8ef7;
  }

  .section { margin-bottom: 24px; }

  .section h3 {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 3px;
    margin-top: 8px;
  }

  input[type="text"], input[type="date"], input[type="number"], textarea {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: #333;
    transition: border-color 0.2s;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: #4f8ef7;
  }

  textarea { resize: vertical; min-height: 60px; }

  .btn {
    display: inline-block;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }

  .btn-primary { background: #4f8ef7; color: #fff; }
  .btn-danger  { background: #f76f6f; color: #fff; font-size: 11px; padding: 5px 9px; }
  .btn-success { background: #4caf7d; color: #fff; width: 100%; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; }

  /* 明細テーブル */
  #items-editor { width: 100%; border-collapse: collapse; font-size: 12px; }
  #items-editor th { background: #f5f7fa; padding: 6px 4px; text-align: left; color: #888; font-weight: normal; }
  #items-editor td { padding: 4px 2px; vertical-align: middle; }
  #items-editor td input { padding: 5px 6px; }

  /* ===== プレビューエリア ===== */
  #preview-area {
    margin-left: 650px;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: auto;
  }

  #preview-area h2 {
    font-size: 13px;
    color: #999;
    margin-bottom: 20px;
    align-self: flex-start;
    margin-left: 20px;
  }

  /* ===== 請求書本体 ===== */
  #invoice {
    width: 794px;
    min-height: 1123px;
    background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    padding: 60px 70px;
    position: relative;
  }

  .inv-title {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 8px;
    margin-bottom: 32px;
    color: #222;
  }

  .inv-meta {
    display: flex;
    justify-content: space-between;
    margin-bottom: 36px;
  }

  .inv-to { flex: 1; }

  .inv-to .client-name {
    font-size: 18px;
    font-weight: bold;
    border-bottom: 2px solid #333;
    padding-bottom: 4px;
    margin-bottom: 6px;
    min-width: 200px;
  }

  .inv-to .honorific { font-size: 13px; color: #666; margin-left: 4px; }

  .inv-info { text-align: right; font-size: 13px; line-height: 2; }


  .inv-from {
    text-align: right;
    font-size: 13px;
    line-height: 1.8;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid #eee;
  }

  .inv-from .from-name { font-size: 16px; font-weight: bold; }

  /* 合計金額 */
  .inv-total-box {
    background: #f5f7fa;
    border: 1px solid #e0e4ea;
    border-radius: 8px;
    padding: 16px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .inv-total-label { font-size: 14px; color: #555; }

  .inv-total-amount {
    font-size: 28px;
    font-weight: bold;
    color: #222;
  }

  .inv-total-amount span { font-size: 14px; margin-right: 4px; }

  /* 明細 */
  .inv-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 24px;
  }

  .inv-table thead tr {
    background: #333;
    color: #fff;
  }

  .inv-table th {
    padding: 10px 12px;
    text-align: left;
    font-weight: normal;
    font-size: 12px;
  }

  .inv-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
  }

  .inv-table tbody tr:last-child td { border-bottom: none; }
  .inv-table tbody tr:nth-child(even) { background: #fafafa; }

  .text-right { text-align: right; }

  .inv-subtotals {
    width: 260px;
    margin-left: auto;
    font-size: 13px;
    line-height: 2;
  }

  .inv-subtotals tr td:first-child { color: #666; }
  .inv-subtotals tr td:last-child { text-align: right; font-weight: 500; }

  .inv-subtotals .total-row td {
    font-size: 15px;
    font-weight: bold;
    padding-top: 6px;
    border-top: 2px solid #333;
  }

  /* 備考・振込先 */
  .inv-notes {
    margin-top: 32px;
    font-size: 12px;
    color: #666;
    line-height: 1.8;
  }

  .inv-notes h4 {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
    font-weight: normal;
  }

  .inv-notes .block { margin-bottom: 16px; }
  .inv-notes .content { white-space: pre-wrap; }


  /* ===== スマホ対応 ===== */
  @media (max-width: 768px) {
    #editor {
      position: static;
      width: 100%;
      border-right: none;
      border-bottom: 1px solid #ddd;
    }

    #preview-area {
      margin-left: 0;
      padding: 20px 10px;
    }

    #invoice {
      width: 100%;
      min-height: auto;
      padding: 24px 16px;
      font-size: 12px;
    }

    .inv-title { font-size: 20px; }
    .inv-total-amount { font-size: 22px; }
    .inv-meta { flex-direction: column; gap: 12px; }
    .inv-info { text-align: left; }
    .inv-subtotals { width: 100%; }
  }

  /* ===== 印刷スタイル ===== */
  @media print {
    body { background: #fff; }
    #editor { display: none; }
    #preview-area { margin-left: 0; padding: 0; }
    #preview-area > h2 { display: none; }
    #invoice {
      box-shadow: none;
      width: 100%;
      min-height: auto;
      padding: 20mm 25mm;
    }
    .no-print { display: none; }
  }
</style>
</head>
<body>

<!-- ===== 編集パネル ===== -->
<div id="editor">
  <div class="mode-toggle no-print">
    <button class="mode-btn active" id="btn-invoice" onclick="setMode('invoice')">請求書</button>
    <button class="mode-btn" id="btn-delivery" onclick="setMode('delivery')">納品書</button>
  </div>
  <h2 id="editor-title">請求書を編集</h2>

  <div class="section">
    <h3>請求先</h3>
    <label>会社名 / 氏名</label>
    <input type="text" id="clientName" value="テクノポリス" oninput="render()">
  </div>

  <div class="section">
    <h3>発行者情報</h3>
    <label>会社名 / 氏名</label>
    <input type="text" id="fromName" value="FAR★STAR" oninput="render()">
    <label>住所</label>
    <input type="text" id="fromAddress" value="東京都杉並区高円寺南2-40-41 小野村ビル101" oninput="render()">
    <label>電話番号</label>
    <input type="text" id="fromTel" value="090-9916-5569" oninput="render()">
    <label>メールアドレス</label>
    <input type="text" id="fromEmail" value="" oninput="render()">
  </div>

  <div class="section">
    <h3>請求書情報</h3>
    <label>発行日</label>
    <input type="date" id="issueDate" oninput="render()">
  </div>

  <div class="section">
    <h3>明細</h3>
    <table id="items-editor">
      <thead>
        <tr>
          <th style="width:8%"></th>
          <th style="width:30%">品目</th>
          <th style="width:11%">数量</th>
          <th style="width:19%">定価</th>
          <th style="width:16%">掛なし</th>
          <th style="width:16%"></th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <button class="btn btn-primary no-print" style="margin-top:10px;width:100%" onclick="addItem()">＋ 明細を追加</button>
    <div id="trash-section"></div>

    <label style="margin-top:14px">掛け率（全品目共通）</label>
    <select id="itemRate" onchange="render()" style="width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;color:#333">
      <option value="0.5">50%</option>
      <option value="0.6">60%</option>
      <option value="0.7">70%</option>
      <option value="0.8">80%</option>
      <option value="1" selected>掛なし</option>
    </select>

    <label style="margin-top:14px">消費税率</label>
    <select id="taxRate" onchange="render()" style="width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;color:#333">
      <option value="0.10" selected>10%</option>
      <option value="0.08">8%（軽減税率）</option>
      <option value="0">非課税</option>
    </select>
  </div>

  <div class="section" id="bank-section">
    <h3>振込先</h3>
    <label>銀行名</label>
    <input type="text" id="bankName" value="三菱UFJ銀行栄町支店" oninput="render()">
    <label>口座種別・番号</label>
    <input type="text" id="bankAccount" value="普通 4650396" oninput="render()">
    <label>口座名義</label>
    <input type="text" id="bankHolder" value="ファースター" oninput="render()">
  </div>

  <div class="section">
    <h3>備考</h3>
    <textarea id="notes" rows="3" oninput="render()">振込手数料はご負担ください。</textarea>
  </div>

  <div class="section">
    <button class="btn btn-success no-print" onclick="printInvoice()">
      📄 PDFで保存
    </button>
  </div>
</div>

<div id="resizer"></div>

<!-- ===== プレビューエリア ===== -->
<div id="preview-area">
  <h2>プレビュー</h2>
  <div id="invoice">
    <!-- JSで描画 -->
  </div>
</div>

<script>
  const STORAGE_KEY = 'seikyusho_data';
  let currentMode = 'invoice';
  let trashedItems = [];
  let trashOpen = false;

  function setMode(mode) {
    currentMode = mode;
    const isInvoice = mode === 'invoice';
    document.getElementById('btn-invoice').classList.toggle('active', isInvoice);
    document.getElementById('btn-delivery').classList.toggle('active', !isInvoice);
    document.getElementById('editor-title').textContent = isInvoice ? '請求書を編集' : '納品書を編集';
    document.getElementById('bank-section').style.display = isInvoice ? '' : 'none';
    render();
  }

  // 初期明細データ
  let items = [
    { name: 'CHARGEEEEEE 人物Tシャツ（25年7月）', qty: 1, price: 2772, rate: 1 },
    { name: 'うずうずくん トートバッグ（25年7月）', qty: 1, price: 1650, rate: 1 },
    { name: '日の丸 ショート丈T 赤白（25年8月）', qty: 1, price: 2310, rate: 1 },
    { name: '百目レギンス（25年8月）', qty: 1, price: 1188, rate: 1 },
    { name: 'アナーキッコウ（25年8月）', qty: 1, price: 2772, rate: 1 },
    { name: 'COW変形ビッグカットソー（25年8月）', qty: 1, price: 2772, rate: 1 },
    { name: 'コスモス Mサイズ（25年9月）', qty: 1, price: 4620, rate: 1 },
    { name: '目苺BIG T ブラック×ホワイト（25年9月）', qty: 1, price: 2772, rate: 1 },
    { name: '百目ハーフパンツ（25年9月）', qty: 1, price: 4620, rate: 1 },
    { name: '日の丸リバーシブルカットソー（モノトーン）（25年9月）', qty: 1, price: 3696, rate: 1 },
    { name: 'クロススカル（25年10月）', qty: 1, price: 2772, rate: 1 },
    { name: 'DEAD OR ALIVE（25年10月）', qty: 1, price: 2772, rate: 1 },
    { name: '目苺変形ビッグカットソー（25年12月）', qty: 1, price: 2772, rate: 1 },
    { name: 'コスモスパーカー ブラック（26年3月）', qty: 1, price: 8250, rate: 1 },
    { name: 'タイダイオクトパスT（26年5月）', qty: 1, price: 2772, rate: 1 },
  ];

  // localStorage から復元
  function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return false;
    try {
      const state = JSON.parse(saved);
      if (state.items) items = state.items;
      if (state.trashedItems) trashedItems = state.trashedItems;
      ['clientName','fromName','fromAddress','fromTel','fromEmail',
       'invNumber','issueDate','bankName','bankAccount','bankHolder','notes'].forEach(id => {
        const el = document.getElementById(id);
        if (el && state[id] !== undefined) el.value = state[id];
      });
      if (state.taxRate !== undefined)
        document.getElementById('taxRate').value = state.taxRate;
      if (state.itemRate !== undefined)
        document.getElementById('itemRate').value = state.itemRate;
      return true;
    } catch(e) { return false; }
  }

  // localStorage へ保存
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      clientName: g('clientName'), fromName: g('fromName'),
      fromAddress: g('fromAddress'), fromTel: g('fromTel'),
      fromEmail: g('fromEmail'), invNumber: g('invNumber'),
      issueDate: g('issueDate'), bankName: g('bankName'),
      bankAccount: g('bankAccount'), bankHolder: g('bankHolder'),
      notes: g('notes'), taxRate: g('taxRate'), itemRate: g('itemRate'), items, trashedItems
    }));
  }

  // 今日の日付を初期値にセット（localStorage になければ）
  const today = new Date();
  const fmt = d => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  };
  loadState();
  document.getElementById('issueDate').value = fmt(today);

  function addItem() {
    items.push({ name: '', qty: 1, price: 0, rate: 1 });
    renderEditor();
    render();
  }

  function removeItem(i) {
    trashedItems.unshift({ ...items[i], deletedAt: Date.now() });
    items.splice(i, 1);
    renderEditor();
    render();
  }

  function moveItem(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= items.length) return;
    [items[i], items[j]] = [items[j], items[i]];
    renderEditor();
    render();
  }

  function restoreItem(i) {
    const item = { ...trashedItems[i] };
    delete item.deletedAt;
    items.push(item);
    trashedItems.splice(i, 1);
    renderEditor();
    render();
  }

  function hardDeleteItem(i) {
    trashedItems.splice(i, 1);
    renderTrash();
    saveState();
  }

  function toggleTrash() {
    trashOpen = !trashOpen;
    renderTrash();
  }

  function renderTrash() {
    const sec = document.getElementById('trash-section');
    if (!sec) return;
    if (!trashedItems.length) { sec.innerHTML = ''; return; }
    const rows = trashedItems.map((item, i) => `
      <tr style="border-bottom:1px solid #f0f0f0">
        <td style="font-size:12px;color:#999;padding:6px 4px;word-break:break-all">${esc(item.name) || '（品目名なし）'}</td>
        <td style="white-space:nowrap;padding:4px 0">
          <button class="btn" style="background:#4f8ef7;color:#fff;font-size:11px;padding:4px 8px;margin-right:2px" onclick="restoreItem(${i})">戻す</button>
          <button class="btn btn-danger" style="font-size:11px;padding:4px 8px" onclick="hardDeleteItem(${i})">完全削除</button>
        </td>
      </tr>
    `).join('');
    sec.innerHTML = `
      <div style="margin-top:10px;border:1px solid #f0d0d0;border-radius:6px;overflow:hidden">
        <button onclick="toggleTrash()" style="background:#fff5f5;border:none;cursor:pointer;font-size:12px;color:#c0392b;padding:8px 12px;width:100%;text-align:left;display:flex;align-items:center;gap:6px;font-family:inherit">
          <span>${trashOpen ? '▼' : '▶'}</span>🗑 ゴミ箱（${trashedItems.length}件）
        </button>
        ${trashOpen ? `<table style="width:100%;border-collapse:collapse;padding:0 8px;display:block;padding:4px 8px">${rows}</table>` : ''}
      </div>
    `;
  }

  function updateItem(i, field, val) {
    if (field === 'noRate') items[i][field] = val;
    else items[i][field] = field === 'name' ? val : (parseFloat(val) || 0);
    render();
  }

  function renderEditor() {
    const tbody = document.getElementById('itemsBody');
    tbody.innerHTML = '';
    items.forEach((item, i) => {
      const noRate = item.noRate || false;
      const isFirst = i === 0;
      const isLast = i === items.length - 1;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="padding:2px;white-space:nowrap">
          <button class="btn" onclick="moveItem(${i},-1)" ${isFirst?'disabled':''} style="background:#eee;color:#555;font-size:10px;padding:2px 5px;display:block;margin-bottom:2px;width:100%;opacity:${isFirst?'0.3':'1'}">▲</button>
          <button class="btn" onclick="moveItem(${i}, 1)" ${isLast ?'disabled':''} style="background:#eee;color:#555;font-size:10px;padding:2px 5px;display:block;width:100%;opacity:${isLast?'0.3':'1'}">▼</button>
        </td>
        <td><input type="text"   value="${esc(item.name)}"  oninput="updateItem(${i},'name',this.value)" placeholder="品目名"></td>
        <td><input type="number" value="${item.qty}"         oninput="updateItem(${i},'qty',this.value)"  min="1"  style="text-align:right"></td>
        <td><input type="number" value="${item.price}"       oninput="updateItem(${i},'price',this.value)" min="0" style="text-align:right"></td>
        <td style="text-align:center;white-space:nowrap">
          <label style="font-size:11px;color:#888;cursor:pointer;margin:0">
            <input type="checkbox" ${noRate ? 'checked' : ''} onchange="updateItem(${i},'noRate',this.checked)" style="width:auto;margin-right:2px">掛なし
          </label>
        </td>
        <td><button class="btn btn-danger" onclick="removeItem(${i})">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
    renderTrash();
  }

  function g(id) { return document.getElementById(id)?.value ?? ''; }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function money(n) { return '¥' + Math.round(n).toLocaleString(); }
  function fmtDate(s) {
    if (!s) return '—';
    const [y,m,d] = s.split('-');
    return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  }

  function render() {
    const taxRate    = parseFloat(document.getElementById('taxRate').value);
    const itemRate   = parseFloat(document.getElementById('itemRate').value);
    const subtotal   = items.reduce((s, it) => s + it.qty * Math.round(it.price * (it.noRate ? 1 : itemRate)), 0);
    const tax        = Math.floor(subtotal * taxRate);
    const total      = subtotal + tax;
    const taxLabel   = taxRate === 0 ? '非課税' : `消費税（${taxRate*100|0}%）`;

    const rows = items.map(it => {
      const unitPrice = Math.round(it.price * (it.noRate ? 1 : itemRate));
      return `
      <tr>
        <td>${esc(it.name)}</td>
        <td class="text-right">${it.qty.toLocaleString()}</td>
        <td class="text-right">${money(unitPrice)}</td>
        <td class="text-right">${money(it.qty * unitPrice)}</td>
      </tr>`;
    }).join('');

    const isInvoice = currentMode === 'invoice';
    const titleText = isInvoice ? '請　求　書' : '納　品　書';

    document.getElementById('invoice').innerHTML = `
      <div class="inv-title">${titleText}</div>

      <div class="inv-meta">
        <div class="inv-to">
          <div class="client-name">${esc(g('clientName'))} <span class="honorific">御中</span></div>
        </div>
        <div class="inv-info">
          <div>発行日：${fmtDate(g('issueDate'))}</div>
        </div>
      </div>

      <div class="inv-from">
        <div class="from-name">${esc(g('fromName'))}</div>
        <div>${esc(g('fromAddress'))}</div>
        ${g('fromTel') ? `<div>TEL: ${esc(g('fromTel'))}</div>` : ''}
        ${g('fromEmail') ? `<div>${esc(g('fromEmail'))}</div>` : ''}
      </div>

      ${isInvoice ? `
      <div class="inv-total-box">
        <div class="inv-total-label">ご請求金額（税込）</div>
        <div class="inv-total-amount"><span>¥</span>${total.toLocaleString()}</div>
      </div>` : ''}

      <table class="inv-table">
        <thead>
          <tr>
            <th>品目</th>
            <th class="text-right">数量</th>
            <th class="text-right">単価</th>
            <th class="text-right">金額</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>

      <table class="inv-subtotals">
        <tr><td>小計</td><td>${money(subtotal)}</td></tr>
        <tr><td>${taxLabel}</td><td>${money(tax)}</td></tr>
        <tr class="total-row"><td>合計</td><td>${money(total)}</td></tr>
      </table>

      <div class="inv-notes">
        ${isInvoice && (g('bankName') || g('bankAccount')) ? `
          <div class="block">
            <h4>お振込先</h4>
            <div class="content">${[g('bankName'), g('bankAccount'), g('bankHolder') ? '名義：' + g('bankHolder') : ''].filter(Boolean).join('\n')}</div>
          </div>
        ` : ''}
        ${g('notes') ? `
          <div class="block">
            <h4>備考</h4>
            <div class="content">${esc(g('notes'))}</div>
          </div>
        ` : ''}
      </div>
    `;
    saveState();
  }

  async function printInvoice() {
    const btn = document.querySelector('.btn-success');
    btn.textContent = '⏳ 生成中...';
    btn.disabled = true;

    try {
      const invoice = document.getElementById('invoice');
      const canvas = await html2canvas(invoice, { scale: 2, useCORS: true });
      const imgData = canvas.toDataURL('image/png');

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const scaleW = pageW / canvas.width;
      const scaleH = pageH / canvas.height;
      const scale = Math.min(scaleW, scaleH);
      const imgW = canvas.width * scale;
      const imgH = canvas.height * scale;
      const xOffset = (pageW - imgW) / 2;
      const yOffset = (pageH - imgH) / 2;
      pdf.addImage(imgData, 'PNG', xOffset, yOffset, imgW, imgH);

      const clientName = document.getElementById('clientName').value || '請求書';
      const docType = currentMode === 'invoice' ? '請求書' : '納品書';
      pdf.save(`${clientName}_${docType}.pdf`);
    } catch(e) {
      alert('PDF生成に失敗しました。もう一度お試しください。');
    }

    btn.textContent = '📄 PDFで保存';
    btn.disabled = false;
  }

  // 初期描画
  renderEditor();
  render();

  // ===== リサイザー =====
  const resizerEl     = document.getElementById('resizer');
  const editorEl      = document.getElementById('editor');
  const previewAreaEl = document.getElementById('preview-area');
  const EDITOR_W_KEY  = 'editorWidth';

  function setEditorWidth(w) {
    w = Math.max(300, Math.min(w, window.innerWidth - 300));
    editorEl.style.width      = w + 'px';
    resizerEl.style.left      = w + 'px';
    previewAreaEl.style.marginLeft = w + 'px';
  }

  const savedEditorW = localStorage.getItem(EDITOR_W_KEY);
  if (savedEditorW) setEditorWidth(parseInt(savedEditorW));

  resizerEl.addEventListener('mousedown', e => {
    e.preventDefault();
    resizerEl.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.addEventListener('mousemove', onResizerMove);
    document.addEventListener('mouseup', onResizerUp);
  });

  function onResizerMove(e) { setEditorWidth(e.clientX); }

  function onResizerUp() {
    resizerEl.classList.remove('dragging');
    document.body.style.userSelect = '';
    localStorage.setItem(EDITOR_W_KEY, editorEl.offsetWidth);
    document.removeEventListener('mousemove', onResizerMove);
    document.removeEventListener('mouseup', onResizerUp);
  }
</script>
</body>
</html>
